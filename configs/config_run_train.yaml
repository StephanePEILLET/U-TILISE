# ============================================================================
# Config de base pour l'entraînement — surcharge les valeurs de default.yaml
# ============================================================================

data:
    dataset: circa                         # Nom du dataset. ['circa']
    hdf5_file: ${oc.env:HDF5_FILE}         # Chemin HDF5 (variable .env)
    max_seq_length: 14                      # Longueur max de séquence temporelle.
    channels: all                          # Bandes spectrales. ['all', 'rgb', 'bgr_nir', liste d'indices]
    use_sar: mix_closest                   # Mode SAR. [false, 'asc', 'desc', 'mix_closest', 'asc+desc']
    subset: false                          # Entier = sous-ensemble de N patches, false = tout le dataset.
    return_valid_obs_only: true            # True = ne retourner que les dates cloud-free lors du sous-échantillonnage.

mask:
    mask_type: random_fully_masked         # ['random_clouds', 'real_clouds', 'random_fully_masked', 'consecutive_fully_masked']

utilise:
    encoder_widths: [64,64,64,64,128]
    decoder_widths: [64,64,64,64,128]

optimizer:
    name: Adam
    learning_rate: 2.e-04
    weight_decay: 1.0e-05

scheduler:
    name: MultiStepLR
    enabled: true
    milestones: [40,60,80,100]
    gamma: 0.5

training_settings:
    batch_size: 2
    num_epochs: 1

misc:
    random_seed: 42
    num_workers: 8
    pin_memory: false

