# ============================================================================
# Config de base pour l'entraînement — surcharge les valeurs de default.yaml
# Pour l'entraînement v4 asc+desc, utiliser plutôt la config dédiée :
#   configs/jzellou/configs/train_v4_asc_desc_random_clouds_combined.yaml
# ============================================================================

data:
    dataset: circa                         # Nom du dataset. ['circa']
    hdf5_file: ${oc.env:HDF5_FILE}         # Chemin HDF5 (variable .env)
    max_seq_length: 5                      # Longueur max de séquence temporelle.
    channels: all                          # Bandes spectrales. ['all', 'rgb', 'bgr_nir', liste d'indices]
    use_sar: mix_closest                   # Mode SAR. [false, 'asc', 'desc', 'mix_closest', 'asc+desc']
    subset: true                          # Entier = sous-ensemble de N patches, false = tout le dataset.
    filter_settings:
        type: cloud-free                   # Stratégie de filtrage des observations nuageuses.
        min_length: 3                      # Longueur minimale de séquence après filtrage.
        return_valid_obs_only: true        # True = ne retourner que les dates cloud-free.

mask:
    mask_type: random_fully_masked         # ['random_clouds', 'real_clouds', 'random_fully_masked', 'consecutive_fully_masked']

utilise:
    encoder_widths: [64,64,64,64,128]
    decoder_widths: [64,64,64,64,128]

optimizer:
    name: Adam
    learning_rate: 2.e-04
    weight_decay: 1.0e-05

scheduler:
    name: MultiStepLR
    enabled: true
    milestones: [40,60,80,100]
    gamma: 0.5

training_settings:
    batch_size: 2
    num_epochs: 1

misc:
    random_seed: 42
