# ============================================================================
# Configuration par défaut du modèle U-TILISE
# Ces paramètres sont surchargés par la config spécifique (train, eval, etc.)
# ============================================================================

data:                                      # Paramètres des données d'entrée
    filter_settings:
        type: cloud-free                   # Stratégie de filtrage des observations nuageuses. ['cloud-free', 'cloud-free_consecutive']
        min_length: 5                      # Longueur minimale de séquence après filtrage.
        return_valid_obs_only: true        # True = ne retourner que les dates cloud-free (train/val).
    pe_strategy: day-of-year               # Stratégie d'encodage positionnel. ['day-of-year', 'day-within-sequence', 'absolute', 'enumeration']
    max_seq_length: 10                     # Longueur maximale de séquence temporelle. None = pas de troncature.
    render_occluded_above_p: 0.9           # Seuil de couverture nuageuse pour masquer entièrement une image.

mask:
    mask_type: random_clouds               # Type de masquage. ['random_clouds', 'real_clouds', 'random_fully_masked', 'consecutive_fully_masked']
    ratio_masked_frames: 0.5               # Part maximale d'images partiellement/totalement masquées par séquence.
    ratio_fully_masked_frames: 0.0         # Part maximale d'images entièrement masquées par séquence.
    fixed_masking_ratio: false             # True = ratio fixe, False = ratio variable entre séquences.
    non_masked_frames: [0]                 # Indices des frames à ne jamais masquer. Ex: [0] = garder la première.
    intersect_real_cloud_masks: false      # True = intersecter les masques aléatoires avec les masques réels.
    dilate_cloud_masks: false              # True = dilater les masques nuageux avant application.
    fill_type: fill_value                  # Initialisation des pixels masqués. ['fill_value', 'white_noise', 'mean']
    fill_value: 1                          # Valeur de remplissage (si fill_type == 'fill_value').
    p_filter: 0.1                          # Probabilité de filtrer un masque (suppression aléatoire de masques).

pad_value: 0                               # Valeur de padding pour les séquences de longueur variable.

utilise:                                   # Architecture U-TILISE (voir src/models/utilise.py)
    # --- Encodeur / Décodeur spatial (U-Net) ---
    encoder_widths: [64,64,64,128]         # Largeurs des niveaux de l'encodeur. Chaque élément = nb de filtres.
    decoder_widths: [64,64,64,128]         # Largeurs des niveaux du décodeur. Doit correspondre à l'encodeur.
    upconv_type: transpose                 # Type d'upsampling. ['transpose', 'bilinear', 'nearest']
    encoder_norm:                          # Normalisation dans l'encodeur. [null, 'batch', 'group', 'instance']
    decoder_norm:                          # Normalisation dans le décodeur. [null, 'batch', 'group', 'instance']
    skip_norm:                             # Normalisation des connexions skip. [null, 'batch', 'group', 'instance']
    activation: relu                       # Fonction d'activation spatiale. ['relu', 'gelu', 'silu']
    str_conv_k: 4                          # Taille du noyau pour la convolution stride (downsampling).
    str_conv_s: 2                          # Stride de la convolution de downsampling.
    str_conv_p: 1                          # Padding de la convolution de downsampling.
    str_conv_k_up: 2                       # Taille du noyau pour la convolution transposée (upsampling).
    str_conv_p_up: 0                       # Padding de la convolution transposée.
    skip_attention: false                  # True = appliquer l'attention sur les connexions skip.
    # --- LTAE (Lightweight Temporal Attention Encoder) ---
    n_temporal_encoding_layers: 1          # Nombre de couches d'encodage temporel dans le LTAE.
    agg_mode: att_group                    # Mode d'agrégation temporelle. ['att_group', 'att_mean']
    n_head: 4                              # Nombre de têtes d'attention dans le LTAE.
    d_k: 4                                 # Dimension des clés/requêtes par tête d'attention.
    bias_qk: false                         # True = biais dans les projections Q/K.
    attn_dropout: 0.1                      # Dropout sur les poids d'attention.
    dropout: 0.1                           # Dropout général dans le réseau.
    n_groups: 4                            # Nombre de groupes pour la normalisation de groupe.
    ltae_norm: group                       # Normalisation dans le LTAE. ['group', 'batch', 'instance']
    ltae_activation: gelu                  # Activation dans le LTAE. ['relu', 'gelu', 'silu']
    norm_first: true                       # True = pré-normalisation (LayerNorm avant attention).
    # --- Sortie ---
    output_activation: sigmoid             # Activation de sortie. ['sigmoid', 'softmax', null]

training_settings:
    batch_size: 3                          # Taille de batch.
    num_epochs: 1000                       # Nombre d'epochs d'entraînement.
    accum_iter: 1                          # Accumulation de gradients sur N itérations.
    gradient_clip_norm: 0                  # Si > 0, clip la norme du gradient.
    gradient_clip_value: 0                 # Si > 0, clip la valeur du gradient.
    early_stop_patience: 0                 # Si > 0, arrêt après N epochs sans amélioration.
    resume: false                          # True = reprendre un entraînement interrompu.
    pretrained_path: ''                    # Chemin vers les poids pré-entraînés.

optimizer:
    name: Adam                             # Optimiseur.
    learning_rate: 2.e-04                  # Taux d'apprentissage initial.
    weight_decay: 0                        # Régularisation L2.

scheduler:
    name: MultiStepLR                      # Scheduler du taux d'apprentissage.
    enabled: true                          # Activer/désactiver le scheduler.
    milestones: [50, 100, 150, 200, 250]   # Epochs de réduction du LR.
    gamma: 0.5                             # Facteur de réduction du LR.

loss:
    ssim_loss: false                       # Perte SSIM (similarité structurelle).
    l1_loss: true                          # Perte L1 sur tous les pixels.
    l1_loss_occluded_input_pixels: false   # L1 sur les pixels masqués en entrée uniquement.
    l1_loss_observed_input_pixels: false   # L1 sur les pixels observés en entrée uniquement.
    masked_l1_loss: false                  # L1 sur les pixels avec vérité terrain valide (masques nuageux réels).
    ndvi_loss: false                       # L1 sur le NDVI (NIR-Red)/(NIR+Red) pour la végétation.
    temporal_r2_loss: false                # (1 - R²) par pixel le long du temps pour la cohérence temporelle.
    ssim_loss_w: 1.0                       # Poids de ssim_loss.
    l1_loss_w: 1.0                         # Poids de l1_loss.
    l1_loss_occluded_input_pixels_w: 1.0   # Poids de l1_loss_occluded_input_pixels.
    l1_loss_observed_input_pixels_w: 1.0   # Poids de l1_loss_observed_input_pixels.
    masked_l1_loss_w: 1.0                  # Poids de masked_l1_loss.
    ndvi_loss_w: 0.15                      # Poids de ndvi_loss. Plage recommandée : 0.05-0.5.
    temporal_r2_loss_w: 0.1                # Poids de temporal_r2_loss. Plage recommandée : 0.05-0.5.

metrics:
    masked_metrics: true                   # True = métriques uniquement sur les pixels avec vérité terrain valide.
    mae: true                              # Erreur absolue moyenne (MAE).
    mse: true                              # Erreur quadratique moyenne (MSE).
    rmse: true                             # Racine de l'erreur quadratique moyenne (RMSE).
    ssim: true                             # Indice de similarité structurelle (SSIM).
    psnr: true                             # Rapport signal-sur-bruit crête (PSNR).
    sam: true                              # Spectral Angle Mapper (SAM).

misc:
    logstep_train: 100                     # Intervalle de log pendant l'entraînement (en itérations).
    checkpoint_every_n_epochs: 5           # Sauvegarde du checkpoint tous les N epochs.
    log_gradients: false                   # True = log des gradients via Weights & Biases.
    val_every_n_epochs: 1                  # Intervalle de validation (en epochs).
    plot_every_n_epochs: 15                # Intervalle de visualisation (en epochs).
    plot_val_sample: []                    # Indices des échantillons de validation à visualiser.
    num_workers: 8                         # Nombre de workers du dataloader.
    random_seed: 0                         # Graine aléatoire.
    pin_memory: false                      # Épinglage mémoire (paramètre dataloader).
    run_mode: train                        # Mode d'exécution. ['train', 'val', 'test']

output:
    suffix:                                # Suffixe ajouté au nom du dossier d'expérience.
    plot_model_txt: true                   # True = sauvegarder l'architecture du modèle en .txt.
