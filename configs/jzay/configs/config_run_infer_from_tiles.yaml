data:
    dataset: circa         # Name of the dataset, ['earthnet2021', 'sen12mscrts']
    hdf5_file: /lustre/fswork/projects/rech/tel/uug84ql/cloud_reconstruction/CIRCA_CR_merged.hdf5 #/mnt/DATA_10T/data_rpg/circa/hdf5/circa_cloud_removal.hdf5
    load_transforms: ./data/CIRCA_patches_datasets_with_transforms.json
    channels: all
    use_sar: mix_closest # asc /desc/ mix_closest / asc+desc
    subset: False   
    max_seq_length: 5                     # Maximum temporal sequence length. Set to None to skip temporal trimming.
    return_windows: true
    filter_settings:
        type: cloud-free
        min_length: 5
        return_valid_obs_only: true

test_data:
    checkpoint: /lustre/fsn1/worksf/projects/rech/tel/uug84ql/cloud_reconstruction/results/ALL_SAR_120_epochs_2025-07-11_16-56/checkpoints/Model_best.pth
    test_config: /lustre/fsn1/worksf/projects/rech/tel/uug84ql/cloud_reconstruction/results/ALL_SAR_120_epochs_2025-07-11_16-56/config.yaml
    data_optique: /lustre/fsn1/projects/rech/tel/commun/Circa/optique_dataset
    data_radar: /lustre/fsn1/projects/rech/tel/commun/Circa/radar_dataset_v4
    test_tiles: "./data/MGRSC_test.json"
    mode: null
    split: test

mask:
    mask_type: random_fully_masked    # Mask the input time series with randomly sampled cloud masks or the actual cloud masks. ['random_clouds', 'real_clouds', "random_fully_masked", "consecutive_fully_masked"]
    ratio_masked_frames: 0.5               # Ratio of partially/fully masked images per image time series (upper bound).
    ratio_fully_masked_frames: 0.0         # Ratio of fully masked images per image time series (upper bound).
    fixed_masking_ratio: false             # True to vary the masking ratio across different image time series, False otherwise.
    non_masked_frames: [0]                 # list of int, time steps to be excluded from masking. E.g., [0] never masks the first frame in a sequence.
    intersect_real_cloud_masks: false      # True to intersect randomly sampled cloud masks with the actual cloud masks, False otherwise.
    dilate_cloud_masks: false              # True to dilate the cloud masks before masking, False otherwise.
    fill_type: fill_value                  # Strategy for initializing masked pixels. ['fill_value', 'white_noise', 'mean']
    fill_value: 1                          # Pixel value of masked pixels. Used if fill_type == 'fill_value'.
    p_filter: 0.1

utilise:
  encoder_widths:
  - 64
  - 64
  - 64
  - 128
  decoder_widths:
  - 64
  - 64
  - 64
  - 128
  upconv_type: transpose
  encoder_norm: null
  decoder_norm: null
  skip_norm: null
  activation: relu
  str_conv_k: 4
  str_conv_s: 2
  str_conv_p: 1
  str_conv_k_up: 2
  str_conv_p_up: 0
  skip_attention: false
  n_temporal_encoding_layers: 1
  agg_mode: att_group
  n_head: 4
  d_k: 4
  bias_qk: false
  attn_dropout: 0.1
  dropout: 0.1
  n_groups: 4
  ltae_norm: group
  ltae_activation: gelu
  norm_first: true
  output_activation: sigmoid

training_settings:
    batch_size: 8                          # Batch size.
    num_epochs: 1000                       # Number of training epochs.
    accum_iter: 1                          # Accumulate gradients for 'accum_iter` iterations.
    gradient_clip_norm: 0                  # If > 0, clips gradient norm to that value.
    gradient_clip_value: 0                 # If > 0, clips gradient at specified value.
    resume: false                          # True to resume training, False otherwise.
    pretrained_path: ''                    # Path to the pretrained model weights.

training_settings:
    batch_size: 1                          # Batch size.
    num_epochs: 1                       # Number of training epochs.
    accum_iter: 1                          # Accumulate gradients for 'accum_iter` iterations.
    gradient_clip_norm: 0                  # If > 0, clips gradient norm to that value.
    gradient_clip_value: 0                 # If > 0, clips gradient at specified value.
    resume: false                          # True to resume training, False otherwise.
    pretrained_path: ''                    # Path to the pretrained model weights.

method:
    model_type: utilise
    pad_value: 0

metrics:
    masked_metrics: true                   # True to compute all pixel-based metrics only over all pixels with valid ground truth, False to evaluate all pixels.
    mae: true                              # Mean absolute error (MAE), computed over all pixels.
    mse: true                              # Mean square error (MSE).
    rmse: true                             # Root mean square error (RMSE).
    ssim: true                             # Structural similarity index (SSIM).
    psnr: true                             # Peak signal-to-noise ratio (PSNR).
    sam: true                              # Spectral angle mapper (SAM).

misc:
    num_workers: 12                        # Number of dataloader worker processes.
    pin_memory: true                      # Pin memory (dataloader settings).
    run_mode: test                        # Run mode. ['train', 'val', 'test']

output:
    save_dir: /lustre/fsn1/projects/rech/tel/uug84ql/cloud_reconstruction
    suffix:                                # Suffix appended to the name of the experiment directory.
    plot_model_txt: true                   # True to dump the model architecture to a txt file, False otherwise.
