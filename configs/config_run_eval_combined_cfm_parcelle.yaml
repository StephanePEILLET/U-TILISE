data:
    dataset: circa
    hdf5_file: /mnt/DATA_10T/data_rpg/circa/hdf5/CIRCA_CR_merged.hdf5
    load_transforms: ./data/CIRCA_patches_datasets_with_transforms.json
    parcel_gpkg: /mnt/stores/store_dai/projets/pac/3str/EXP_2/Data_Vecteur/CIRCA+_parcels_full.gpkg
    channels: all
    use_sar: mix_closest
    subset: false
    max_seq_length: 14
    filter_settings:
        type: cloud-free
        min_length: 5
        return_valid_obs_only: true

test_data:
    checkpoint: /mnt/stores/store_dai/tmp/speillet/cloud_reconstruction_results/U-TILISE/v3_mix_closest_random_clouds_combined/2026-03-26_16-17/checkpoints/Model_best.pth
    test_config: /mnt/stores/store_dai/tmp/speillet/cloud_reconstruction_results/U-TILISE/v3_mix_closest_random_clouds_combined/2026-03-26_16-17/config.yaml
    hdf5_file: /mnt/DATA_10T/data_rpg/circa/hdf5/CIRCA_CR_merged.hdf5
    mode: null
    split: test

mask:
    mask_type: consecutive_fully_masked
    ratio_masked_frames: 0.5
    ratio_fully_masked_frames: 0.0
    fixed_masking_ratio: false
    non_masked_frames: [0]
    intersect_real_cloud_masks: false
    dilate_cloud_masks: false
    fill_type: fill_value
    fill_value: 1
    p_filter: 0.1

utilise:
    encoder_widths: [64, 96, 128, 192, 256]
    decoder_widths: [96, 128, 192, 192, 256]
    n_head: 8
    d_k: 4
    n_groups: 8

training_settings:
    batch_size: 1
    num_epochs: 1
    accum_iter: 1
    gradient_clip_norm: 0
    gradient_clip_value: 0
    resume: false
    pretrained_path: ''

method:
    model_type: utilise
    pad_value: 0

metrics:
    masked_metrics: true
    mae: true
    mse: true
    rmse: true
    ssim: true
    psnr: true
    sam: true

misc:
    num_workers: 8
    pin_memory: true
    run_mode: test

output:
    save_dir: /home/SPeillet/data_rpg/outputs/U-TILISE/metrics/v3_combined/consecutive_fully_masked_parcelle
    suffix:
    plot_model_txt: true
