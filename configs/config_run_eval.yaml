# ============================================================================
# Config de base pour l'évaluation — surcharge les valeurs de default.yaml
# Pour l'évaluation v4 asc+desc, utiliser les configs dans configs/jzellou/configs/
# ============================================================================

data:
    dataset: circa
    hdf5_file: ${oc.env:HDF5_FILE}
    load_transforms: ${oc.env:LOAD_TRANSFORMS,./data/patches_with_transforms.json}
    channels: all
    use_sar: asc+desc                      # Mode SAR : asc / desc / mix_closest / asc+desc
    subset: false
    blend_mode: center                     # Mode de fusion : switch / center / center_only / iterative
    max_seq_length: 14                     # Fenêtre temporelle (14 par défaut en évaluation).
    return_windows: true
    filter_settings:
        type: cloud-free
        min_length: 5
        return_valid_obs_only: true

test_data:
    checkpoint: ${oc.env:CHECKPOINT}       # Checkpoint du modèle entraîné.
    test_config: ${oc.env:TRAIN_CONFIG}    # Config sauvegardée durant l'entraînement.
    hdf5_file: ${oc.env:HDF5_FILE}
    mode: null
    split: test

mask:
    mask_type: random_fully_masked         # ['random_clouds', 'real_clouds', 'random_fully_masked', 'consecutive_fully_masked']

training_settings:
    batch_size: 1
    num_epochs: 1

misc:
    num_workers: 12
    pin_memory: true
    run_mode: test

output:
    save_dir: ${oc.env:OUTPUT_DIR}/metrics
