# ============================================================================
# Config de base pour l'évaluation — surcharge les valeurs de default.yaml
# Pour l'évaluation v4 asc+desc, utiliser les configs dans configs/jzellou/configs/
# ============================================================================

data:
    dataset: circa                         # Nom du dataset. ['circa']
    hdf5_file: ${oc.env:HDF5_FILE}         # Chemin HDF5 (variable .env)
    load_transforms: ${oc.env:LOAD_TRANSFORMS,./metadata/patches_with_transforms.json}  # JSON des transformations géométriques.
    channels: all                          # Bandes spectrales. ['all', 'rgb', 'bgr_nir', liste d'indices]
    use_sar: asc+desc                      # Mode SAR. [false, 'asc', 'desc', 'mix_closest', 'asc+desc']
    subset: false                          # Entier = sous-ensemble de N patches, false = tout.
    blend_mode: center                     # Mode de fusion temporelle. ['switch', 'center', 'center_only', 'iterative']
    max_seq_length: 14                     # Fenêtre temporelle (14 par défaut en évaluation).
    return_windows: true                   # Retourner les coordonnées de la fenêtre dans le batch.
    filter_settings:
        type: cloud-free
        min_length: 5
        return_valid_obs_only: true

test_data:
    checkpoint: ${oc.env:CHECKPOINT}       # Checkpoint du modèle entraîné.
    test_config: ${oc.env:TRAIN_CONFIG}    # Config sauvegardée durant l'entraînement.
    hdf5_file: ${oc.env:HDF5_FILE}
    mode: null
    split: test

mask:
    mask_type: random_fully_masked         # ['random_clouds', 'real_clouds', 'random_fully_masked', 'consecutive_fully_masked']

training_settings:
    batch_size: 1
    num_epochs: 1

misc:
    num_workers: 12
    pin_memory: true
    run_mode: test

output:
    save_dir: ${oc.env:OUTPUT_DIR}/metrics
