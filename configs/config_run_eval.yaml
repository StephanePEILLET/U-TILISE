# ============================================================================
# Config de base pour l'évaluation — surcharge les valeurs de default.yaml
# Pour l'évaluation v4 asc+desc, utiliser les configs dans configs/jzellou/configs/
# ============================================================================

data:
    dataset: circa         # Jeu de données. ['circa']
    hdf5_file: /mnt/DATA_10T/data_rpg/circa/hdf5/CIRCA_CR_merged.hdf5
    load_transforms: ./data/patches_with_transforms.json
    # parcel_gpkg: chemin/vers/parcelles.gpkg  # Chemin vers le GPKG parcellaire (null = désactivé).
    channels: all
    use_sar: asc+desc # Mode SAR : asc / desc / mix_closest / asc+desc
    subset: false  
    blend_mode: center                     # Mode de fusion : switch / center / center_only / iterative
    max_seq_length: 14                     # Fenêtre temporelle (14 par défaut en évaluation).
    return_windows: true
    filter_settings:
        type: cloud-free
        min_length: 5
        return_valid_obs_only: true

test_data:
    checkpoint: /chemin/vers/Model_best.pth        # Checkpoint du modèle entraîné.
    test_config: /chemin/vers/config.yaml          # Config sauvegardée durant l'entraînement.
    hdf5_file: /mnt/DATA_10T/data_rpg/circa/hdf5/CIRCA_CR_merged.hdf5
    mode: null
    split: test

mask:
    mask_type: random_fully_masked    # Type de masquage. ['random_clouds', 'real_clouds', 'random_fully_masked', 'consecutive_fully_masked']
    ratio_masked_frames: 0.5               # Part maximale de frames masquées.
    ratio_fully_masked_frames: 0.0
    fixed_masking_ratio: false
    non_masked_frames: [0]
    intersect_real_cloud_masks: false
    dilate_cloud_masks: false
    fill_type: fill_value
    fill_value: 1
    p_filter: 0.1

utilise:
  encoder_widths:
  - 64
  - 64
  - 64
  - 128
  decoder_widths:
  - 64
  - 64
  - 64
  - 128
  upconv_type: transpose
  encoder_norm: null
  decoder_norm: null
  skip_norm: null
  activation: relu
  str_conv_k: 4
  str_conv_s: 2
  str_conv_p: 1
  str_conv_k_up: 2
  str_conv_p_up: 0
  skip_attention: false
  n_temporal_encoding_layers: 1
  agg_mode: att_group
  n_head: 4
  d_k: 4
  bias_qk: false
  attn_dropout: 0.1
  dropout: 0.1
  n_groups: 4
  ltae_norm: group
  ltae_activation: gelu
  norm_first: true
  output_activation: sigmoid

training_settings:
    batch_size: 8                          # Batch size.
    num_epochs: 1000                       # Number of training epochs.
    accum_iter: 1                          # Accumulate gradients for 'accum_iter` iterations.
    gradient_clip_norm: 0                  # If > 0, clips gradient norm to that value.
    gradient_clip_value: 0                 # If > 0, clips gradient at specified value.
    resume: false                          # True to resume training, False otherwise.
    pretrained_path: ''                    # Path to the pretrained model weights.

training_settings:
    batch_size: 1                          # Batch size.
    num_epochs: 1                       # Number of training epochs.
    accum_iter: 1                          # Accumulate gradients for 'accum_iter` iterations.
    gradient_clip_norm: 0                  # If > 0, clips gradient norm to that value.
    gradient_clip_value: 0                 # If > 0, clips gradient at specified value.
    resume: false                          # True to resume training, False otherwise.
    pretrained_path: ''                    # Path to the pretrained model weights.

method:
    model_type: utilise
    pad_value: 0

metrics:
    masked_metrics: true                   # True to compute all pixel-based metrics only over all pixels with valid ground truth, False to evaluate all pixels.
    mae: true                              # Mean absolute error (MAE), computed over all pixels.
    mse: true                              # Mean square error (MSE).
    rmse: true                             # Root mean square error (RMSE).
    ssim: true                             # Structural similarity index (SSIM).
    psnr: true                             # Peak signal-to-noise ratio (PSNR).
    sam: true                              # Spectral angle mapper (SAM).

misc:
    num_workers: 12                        # Number of dataloader worker processes.
    pin_memory: true                      # Pin memory (dataloader settings).
    run_mode: test                        # Run mode. ['train', 'val', 'test']

output:
    save_dir: /mnt/DATA_10T/data_rpg/outputs/U-TILISE/metrics/all_bands_sar_closest_mix_random_fully_masked_da
    suffix:                                # Suffix appended to the name of the experiment directory.
    plot_model_txt: true                   # True to dump the model architecture to a txt file, False otherwise.
