# ============================================================================
# Config de base pour l'inférence à la tuile — surcharge les valeurs de default.yaml
# ============================================================================

data:
    dataset: circa
    hdf5_file: ${oc.env:HDF5_FILE}
    load_transforms: ${oc.env:LOAD_TRANSFORMS,./data/patches_with_transforms.json}
    channels: all
    use_sar: mix_closest                   # Mode SAR : asc / desc / mix_closest / asc+desc
    subset: false
    max_seq_length: 5
    return_windows: true
    filter_settings:
        type: cloud-free
        min_length: 5
        return_valid_obs_only: true

test_data:
    checkpoint: ${oc.env:CHECKPOINT}
    test_config: ${oc.env:TRAIN_CONFIG}
    data_optique: ${oc.env:DATA_OPTIQUE}
    data_radar: ${oc.env:DATA_RADAR}
    test_tiles: "./data/test_tiles.json"
    mode: null
    split: test

mask:
    mask_type: random_fully_masked

training_settings:
    batch_size: 1
    num_epochs: 1

misc:
    run_mode: test

output:
    save_dir: ${oc.env:OUTPUT_DIR}/inference/tiles
