data:
    dataset: circa
    hdf5_file: /var/data/datasets/CIRCA_CR_merged.hdf5
    max_seq_length: 10
    channels: all
    use_sar: asc+desc
    image_size: [256, 256]
    subset: false
    augment: true
    filter_settings:
        type: cloud-free
        min_length: 5
        return_valid_obs_only: true

mask:
    mask_type: random_clouds
    ratio_masked_frames: 0.6
    ratio_fully_masked_frames: 0.4
    fixed_masking_ratio: false
    non_masked_frames: [0]
    intersect_real_cloud_masks: false
    dilate_cloud_masks: false
    fill_type: fill_value
    fill_value: 1
    p_filter: 0.1

method:
    model_type: utilise
    pad_value: 0

# Architecture élargie (wider) — identique à v3_combined
# Contraintes : len(enc) == len(dec) ✓ | enc[-1] == dec[-1] ✓
utilise:
    encoder_widths: [64, 96, 128, 192, 256]
    decoder_widths: [96, 128, 192, 192, 256]
    n_head: 8
    d_k: 4
    n_groups: 8

optimizer:
    name: Adam
    learning_rate: 1.5e-04
    weight_decay: 1.0e-05

# Scheduler cyclique (CosineAnnealingWarmRestarts)
scheduler:
    name: CosineAnnealingWarmRestarts
    enabled: true
    T_0: 40
    T_mult: 2
    eta_min: 1.e-06
    milestones: null
    gamma: null

# Loss combinée v4 : L1 + SSIM + L1 occluded + NDVI + R² temporel
loss:
    ssim_loss: true
    l1_loss: true
    l1_loss_occluded_input_pixels: true
    l1_loss_observed_input_pixels: false
    masked_l1_loss: false
    ndvi_loss: true
    temporal_r2_loss: true
    ssim_loss_w: 0.5
    l1_loss_w: 1.0
    l1_loss_occluded_input_pixels_w: 2.0
    l1_loss_observed_input_pixels_w: 1.0
    masked_l1_loss_w: 1.0
    ndvi_loss_w: 0.15
    temporal_r2_loss_w: 0.1

training_settings:
    batch_size: 4
    num_epochs: 200
    accum_iter: 2
    gradient_clip_norm: 1.0
    gradient_clip_value: 0
    early_stop_patience: 30
    resume: false
    pretrained_path: ''

misc:
    logstep_train: 100
    checkpoint_every_n_epochs: 5
    log_gradients: false
    val_every_n_epochs: 1
    plot_every_n_epochs: 15
    plot_val_sample: []
    num_workers: 12
    random_seed: 0
    pin_memory: true
    run_mode: train
