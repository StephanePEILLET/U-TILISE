data:
    dataset: circa
    hdf5_file: /var/data/datasets/CIRCA_CR_merged.hdf5
    max_seq_length: 10
    channels: all
    use_sar: mix_closest
    image_size: [256, 256]
    subset: false
    augment: false
    filter_settings:
        type: cloud-free
        min_length: 5
        return_valid_obs_only: true

mask:
    mask_type: random_clouds
    ratio_masked_frames: 0.6
    ratio_fully_masked_frames: 0.3
    fixed_masking_ratio: false
    non_masked_frames: [0]
    intersect_real_cloud_masks: false
    dilate_cloud_masks: false
    fill_type: fill_value
    fill_value: 1
    p_filter: 0.1

method:
    model_type: utilise
    pad_value: 0

# Architecture élargie : plus de capacité dans les étages intermédiaires
# Contraintes respectées :
#   - len(encoder_widths) == len(decoder_widths)  ✓  (5 == 5)
#   - encoder_widths[-1] == decoder_widths[-1]     ✓  (256 == 256)
# Le décodeur est asymétrique : plus large que l'encodeur pour mieux
# recombiner les features avec les skip connections.
utilise:
    encoder_widths: [64, 96, 128, 192, 256]
    decoder_widths: [96, 128, 192, 192, 256]
    n_head: 8          # Plus de têtes d'attention (vs 4) pour le bottleneck élargi
    d_k: 4
    n_groups: 8        # GroupNorm avec plus de groupes pour 256 channels

optimizer:
    name: Adam
    learning_rate: 1.5e-04                     # LR légèrement réduit pour stabilité avec modèle plus gros
    weight_decay: 1.0e-05

scheduler:
    name: MultiStepLR
    enabled: true
    milestones: [40, 60, 80, 100, 140, 180]
    gamma: 0.5

loss:
    ssim_loss: false
    l1_loss: true
    l1_loss_occluded_input_pixels: false
    l1_loss_observed_input_pixels: false
    masked_l1_loss: false
    ssim_loss_w: 1.0
    l1_loss_w: 1.0
    l1_loss_occluded_input_pixels_w: 1.0
    l1_loss_observed_input_pixels_w: 1.0
    masked_l1_loss_w: 1.0

training_settings:
    batch_size: 4                              # Réduit de 6→4 pour compenser la mémoire GPU
    num_epochs: 200
    accum_iter: 2                              # Compense le batch_size réduit (effective batch = 8)
    gradient_clip_norm: 1.0
    gradient_clip_value: 0
    early_stop_patience: 30
    resume: false
    pretrained_path: ''

misc:
    logstep_train: 100
    checkpoint_every_n_epochs: 5
    log_gradients: false
    val_every_n_epochs: 1
    plot_every_n_epochs: 15
    plot_val_sample: []
    num_workers: 12
    random_seed: 0
    pin_memory: true
    run_mode: train
