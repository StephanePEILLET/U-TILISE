data:
  dataset: circa
  hdf5_file: ${oc.env:HDF5_FILE}
  max_seq_length: 10
  channels: all
  use_sar: mix_closest
  image_size:
  - 256
  - 256
  subset: false
  augment: true
  filter_settings:
    type: cloud-free
    min_length: 5
    return_valid_obs_only: true
mask:
  mask_type: random_clouds
  ratio_masked_frames: 0.6
  ratio_fully_masked_frames: 0.4
utilise:
  encoder_widths:
  - 64
  - 96
  - 128
  - 192
  - 256
  decoder_widths:
  - 96
  - 128
  - 192
  - 192
  - 256
  n_head: 8
  d_k: 4
  n_groups: 8
optimizer:
  name: Adam
  learning_rate: 0.00015
  weight_decay: 1.0e-05
scheduler:
  name: CosineAnnealingWarmRestarts
  enabled: true
  T_0: 40
  T_mult: 2
  eta_min: 1.0e-06
  milestones: null
  gamma: null
loss:
  ssim_loss: true
  l1_loss: true
  l1_loss_occluded_input_pixels: true
  l1_loss_observed_input_pixels: false
  masked_l1_loss: false
  ndvi_loss: true
  temporal_r2_loss: true
  ssim_loss_w: 0.5
  l1_loss_w: 1.0
  l1_loss_occluded_input_pixels_w: 2.0
  l1_loss_observed_input_pixels_w: 1.0
  masked_l1_loss_w: 1.0
  ndvi_loss_w: 0.15
  temporal_r2_loss_w: 0.1
training_settings:
  batch_size: 4
  num_epochs: 200
  accum_iter: 2
  gradient_clip_norm: 1.0
  early_stop_patience: 30
misc:
  logstep_train: 100
  checkpoint_every_n_epochs: 5
  log_gradients: false
  val_every_n_epochs: 1
  plot_every_n_epochs: 15
  plot_val_sample: []
  num_workers: 12
  random_seed: 0
  pin_memory: true
  run_mode: train
