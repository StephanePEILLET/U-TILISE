data:
  dataset: circa
  hdf5_file: ${oc.env:HDF5_FILE}
  load_transforms: ${oc.env:LOAD_TRANSFORMS,./metadata/patches_with_transforms.json}
  channels: all
  use_sar: asc+desc
  subset: false
  max_seq_length: 10
  return_windows: true
  filter_settings:
    type: cloud-free
    min_length: 5
    return_valid_obs_only: true
test_data:
  checkpoint: /mnt/common/hdd/home/SPeillet/outputs/U-TILISE/v4_asc_desc_random_clouds_combined/2026-03-29_16-10/checkpoints/Model_best.pth
  test_config: /mnt/common/hdd/home/SPeillet/outputs/U-TILISE/v4_asc_desc_random_clouds_combined/2026-03-29_16-10/config.yaml
  data_optique: ${oc.env:DATA_OPTIQUE}
  data_radar: ${oc.env:DATA_RADAR}
  mask_type: original_masks
  test_tiles: ./metadata/test_tiles.json
  mode: null
  split: test
mask:
  mask_type: original_masks
utilise:
  encoder_widths:
  - 64
  - 96
  - 128
  - 192
  - 256
  decoder_widths:
  - 96
  - 128
  - 192
  - 192
  - 256
  n_head: 8
  d_k: 4
  n_groups: 8
training_settings:
  batch_size: 1
  num_epochs: 1
misc:
  num_workers: 0
  pin_memory: true
  run_mode: test
output:
  save_dir: ${oc.env:OUTPUT_DIR}/inference/v4_asc_desc/mode_produit
